version: '3.8'

x-common-environment: &common-environment
  NODE_ENV: production
  RPC_URLS: ${RPC_URLS}
  BSC_MAINNET_RPC_URLS: ${BSC_MAINNET_RPC_URLS}
  BSC_MAINNET_FORK_RPC_URLS: ${BSC_MAINNET_FORK_RPC_URLS}
  REDIS_HOST: redis-server
  REDIS_PASSWORD: ${REDIS_PASSWORD}

services:
  redis-server:
    image: redis:latest
    mem_limit: 350m
    ports:
      - '6379:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    volumes:
      - redis-data:/data

  collector:
    build:
      context: .
      dockerfile: packages/collector/Dockerfile
    environment:
      <<: *common-environment
      FORK_RPC_URL: ${FORK_RPC_URL}
      NODE_OPTIONS: --max_old_space_size=6144
    depends_on:
      - redis-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 7168M

  liquidation-checker-cs2-skins:
    build:
      context: .
      dockerfile: packages/liquidation-checker/Dockerfile
    environment:
      <<: *common-environment
      MARKET: CS2 Skins
      NODE_OPTIONS: --max_old_space_size=614
    depends_on:
      - redis-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.65'
          memory: 768M

  liquidation-spotify-the-weeknd:
